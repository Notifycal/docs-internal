name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # github.head_ref is only set when the workflow was triggered by a pull_request and it
  # contains the value of the source branch of the PR.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-1

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      infra: ${{ steps.filter.outputs.tf }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Detect changes
        uses: dorny/paths-filter@v3
        # Skip the filter if there is no PR to filter
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: .github/filters.yaml

  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    needs: changes
    # Runs if there are changes to the infra (PR) or the event isn't PR
    if: |
      needs.changes.outputs.infra == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6

      # TODO: Extract from here
      - name: Get GH token from Github App
        id: gh-app-auth
        uses: getsentry/action-github-app-token@v3
        with:
          app_id: ${{ secrets.NOTIFYCAL_CICD_APP_ID }}
          private_key: ${{ secrets.NOTIFYCAL_CICD_APP_SECRET }}
      - name: Hack for github internal repo access :(
        run: git config --global url."https://foo:${{ steps.gh-app-auth.outputs.token }}@github.com".insteadOf ssh://git@github.com

      - name: Configure AWS Credentials (OIDC Role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_OIDC_ROLE_CI }}
          role-session-name: run-${{ github.run_id }}

      - run: aws sts get-caller-identity

      - name: Configure AWS Credentials (CI/CD Role)
        id: config_aws_credentials_ci_role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_CI_NONPROD }}
          role-session-name: run-${{ github.run_id }}
          role-chaining: true
          role-duration-seconds: 3600 # chaining max is 3600s

      - run: aws sts get-caller-identity
      - name: Get tofu version from .opentofu-version
        run: echo "tofu_version=$(cat .opentofu-version)" >> "${GITHUB_OUTPUT}"
        id: get_tofu_version
        working-directory: tf
      - name: Cached tofu binary?
        id: tofu-binary-cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/bin/tofu
          key: ${{ runner.os }}-tofu-${{ env.TOFU_VERSION }}
        env:
          TOFU_VERSION: ${{ steps.get_tofu_version.outputs.tofu_version }}

      - name: Install OpenTofu
        # Only if there is no cache
        if: steps.tofu-binary-cache.outputs.cache-hit != 'true'
        run: |
          DOWNLOAD_URL="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          TEMP_DIR=$(mktemp -d)

          curl -sL "${DOWNLOAD_URL}" -o "${TEMP_DIR}/tofu.tar.gz"
          tar -zxf "${TEMP_DIR}/tofu.tar.gz" -C "${TEMP_DIR}"

          chmod +x "${TEMP_DIR}/tofu"
          sudo mv "${TEMP_DIR}/tofu" /usr/local/bin

          rm -rf "${TEMP_DIR}"

          tofu --version
        env:
          TOFU_VERSION: ${{ steps.get_tofu_version.outputs.tofu_version }}
      # TODO: Extract until here

      - run: tofu init && tofu validate
        working-directory: tf
      - run: tofu plan -out plan.tfplan
        working-directory: tf
      - uses: actions/upload-artifact@v7
        # Only produces artifacts when running on push or manually
        if: github.event_name != 'pull_request'
        with:
          name: tf
          path: |
            tf/plan.tfplan
            tf/dist/
            tf/builds/

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: changes
    if: |
      needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lint files
        id: lint
        run: npm run lint
        continue-on-error: true
      - name: Check formatting
        id: format
        run: npm run prettier
        continue-on-error: true
      # Testing would go here, but maybe not on PR checks (time and money)
      - run: npm run build
        id: build
        continue-on-error: true
      - name: Pass or fail?
        # Check previous step outcomes (only if the step has an id)
        run: |
          if [[ ${{ contains(steps.*.outcome, 'failure') }} == "true" ]]; then exit 1; else exit 0; fi
      - uses: actions/upload-artifact@v7
        # Only produces artifacts when running on push or manually
        if: github.event_name != 'pull_request'
        with:
          name: build
          path: dist/

  cd:
    runs-on: ubuntu-latest
    needs:
      - plan
      - build
    # environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      site_url: ${{ steps.get_site_url.outputs.site_url }}
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Get GH token from Github App
        id: gh-app-auth
        uses: getsentry/action-github-app-token@v3
        with:
          app_id: ${{ secrets.NOTIFYCAL_CICD_APP_ID }}
          private_key: ${{ secrets.NOTIFYCAL_CICD_APP_SECRET }}
      - name: Hack for github internal repo access :(
        run: git config --global url."https://foo:${{ steps.gh-app-auth.outputs.token }}@github.com".insteadOf ssh://git@github.com

      - name: Configure AWS Credentials (OIDC Role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_OIDC_ROLE_CI }}
          role-session-name: run-${{ github.run_id }}

      - run: aws sts get-caller-identity

      - name: Configure AWS Credentials (CI/CD Role)
        id: config_aws_credentials_ci_role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_CI_NONPROD }}
          role-session-name: run-${{ github.run_id }}
          role-chaining: true
          role-duration-seconds: 3600 # chaining max is 3600s

      - run: aws sts get-caller-identity

      - name: Get tofu version from .opentofu-version
        run: echo "tofu_version=$(cat .opentofu-version)" >> "${GITHUB_OUTPUT}"
        id: get_tofu_version
        working-directory: tf
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ steps.get_tofu_version.outputs.tofu_version }}
          tofu_wrapper: false # https://github.com/jqlang/jq/issues/2287
      - uses: actions/download-artifact@v8
        with:
          name: tf
          path: tf/
      - run: tofu init && tofu apply plan.tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: tf
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: dist/
      - name: Display structure of downloaded files
        run: ls -R
      - name: Get bucket name from outputs
        id: getbucketname
        run: |
          tofu output -raw bucket_name
          s3_bucket="$(tofu output -raw bucket_name)"
          echo "S3 Bucket name: ${s3_bucket}"
          echo "s3_bucket=${s3_bucket}" >> "${GITHUB_OUTPUT}"
        working-directory: tf
      - name: Deploy to S3
        run: aws s3 sync --delete ./dist/ s3://${{ env.BUCKET }}
        env:
          BUCKET: ${{ steps.getbucketname.outputs.s3_bucket }}
      - name: Retrieve site URL
        id: get_site_url
        run: |
          SITE_URL="$(tofu output -raw site_url)"
          echo "site_url=${SITE_URL}" >> "${GITHUB_OUTPUT}"
        working-directory: tf
  info:
    runs-on: ubuntu-latest
    needs: cd
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    env:
      SITE_URL: ${{ needs.cd.outputs.site_url }}
    steps:
      - name: Set Job summary
        run: |
          echo "Access the documentation on the following URL: ${SITE_URL}" >> "${GITHUB_STEP_SUMMARY}"
